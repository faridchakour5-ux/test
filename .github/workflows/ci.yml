name: CI

on:
  push:
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kalam
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kalam/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --ci
      # Les jours, séries et objectifs dépendent du fuseau horaire: toute la suite est rejouée dans deux fuseaux extrêmes
      # (Kiritimati, UTC+14, et Los Angeles, avec heure d'été), en plus du fuseau par défaut du serveur (UTC).
      - name: Tests dans le fuseau Pacific/Kiritimati
        run: npm test -- --ci
        env:
          TZ: Pacific/Kiritimati
      - name: Tests dans le fuseau America/Los_Angeles
        run: npm test -- --ci
        env:
          TZ: America/Los_Angeles
      # Compilation réelle du bundle Android (Hermes), comme le fera EAS: détecte tout de suite un import natif cassé.
      - name: Bundle Android
        run: npx expo export --platform android --output-dir /tmp/kalam-android
      # Même compilation avec un identifiant d'application personnalisé et un build « production » correctement configuré.
      - name: Configuration de production (identifiant et serveur)
        run: >-
          npx expo config --type public --json |
          node -e "const d=JSON.parse(require('fs').readFileSync(0,'utf8')); if (d.android.package!=='com.exemple.kalam'||d.ios.bundleIdentifier!=='com.exemple.kalam') { console.error('identifiant inattendu', d.android.package, d.ios.bundleIdentifier); process.exit(1); } console.log('ok', d.android.package)"
        env:
          KALAM_APP_ID: com.exemple.kalam
          EAS_BUILD_PROFILE: production
          EXPO_PUBLIC_API_URL: https://api.exemple.test

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test
