name: CI

on:
  push:
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kalam
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kalam/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --ci
      # Les jours, séries et objectifs dépendent du fuseau horaire: toute la suite est rejouée dans deux fuseaux extrêmes
      # (Kiritimati, UTC+14, et Los Angeles, avec heure d'été), en plus du fuseau par défaut du serveur (UTC).
      - name: Tests dans le fuseau Pacific/Kiritimati
        run: npm test -- --ci
        env:
          TZ: Pacific/Kiritimati
      - name: Tests dans le fuseau America/Los_Angeles
        run: npm test -- --ci
        env:
          TZ: America/Los_Angeles

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test
