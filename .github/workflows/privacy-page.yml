name: Publier la politique de confidentialité

# Lancement MANUEL. Prérequis (par vous): GitHub > Settings > Pages > Source = « GitHub Actions ».
# L'adresse obtenue (https://<compte>.github.io/<dépôt>/privacy.html) se colle dans la Play Console.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node kalam/scripts/privacyPage.js PRIVACY.md site/privacy.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
