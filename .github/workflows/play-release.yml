name: Envoi sur Google Play

# Lancement MANUEL uniquement (Actions > Envoi sur Google Play > Run workflow). Ne fait rien sans vos secrets.
# Prérequis (une seule fois, par vous): application créée dans la Play Console avec un premier .aab envoyé à la main,
# compte de service Play ajouté comme secret, clé de signature créée chez vous. Détails: PUBLISHING.md section 11.
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "Numéro de version Android (entier, plus grand que celui du dernier envoi)"
        required: true
      track:
        description: "Piste Google Play"
        required: true
        default: internal
        type: choice
        options: [internal, alpha, beta]
      status:
        description: "État de la version"
        required: true
        default: draft
        type: choice
        options: [draft, completed]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: play-release   # protégé: vous pouvez exiger une approbation (Settings > Environments)
    defaults:
      run:
        working-directory: kalam
    env:
      KALAM_APP_ID: ${{ secrets.KALAM_APP_ID }}
      EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
      EAS_BUILD_PROFILE: production   # refuse la construction sans adresse HTTPS du serveur (app.config.js)
      KALAM_KEYSTORE_PASSWORD: ${{ secrets.KALAM_KEYSTORE_PASSWORD }}
      KALAM_KEY_ALIAS: ${{ secrets.KALAM_KEY_ALIAS }}
      KALAM_KEY_PASSWORD: ${{ secrets.KALAM_KEY_PASSWORD }}
      KALAM_VERSION_CODE: ${{ inputs.version_code }}
    steps:
      - name: Numéro de version valide (entier positif sans zéro au début)
        env:
          VC: ${{ inputs.version_code }}
        run: |
          if ! printf '%s' "$VC" | grep -Eq '^[1-9][0-9]{0,9}$' || [ "$VC" -gt 2100000000 ]; then echo "::error::version_code invalide: « $VC » (entier de 1 à 2100000000, sans zéro au début)"; exit 1; fi
      - name: Vérifier que les secrets sont présents
        env:
          KEYSTORE_B64: ${{ secrets.KALAM_KEYSTORE_BASE64 }}
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          missing=""
          for v in KALAM_APP_ID EXPO_PUBLIC_API_URL KALAM_KEYSTORE_PASSWORD KALAM_KEY_ALIAS KALAM_KEY_PASSWORD; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          [ -n "$KEYSTORE_B64" ] || missing="$missing KALAM_KEYSTORE_BASE64"
          [ -n "$PLAY_JSON" ] || missing="$missing PLAY_SERVICE_ACCOUNT_JSON"
          if [ -n "$missing" ]; then echo "::error::Secrets manquants:$missing (voir PUBLISHING.md section 11)"; exit 1; fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kalam/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npm run typecheck && npm run lint && npm test -- --ci
      - name: Projet Android natif
        run: npx expo prebuild --platform android --no-install
      - name: Clé de signature (jamais écrite dans le dépôt)
        env:
          KEYSTORE_B64: ${{ secrets.KALAM_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/kalam-upload.jks"
          echo "KALAM_KEYSTORE_FILE=$RUNNER_TEMP/kalam-upload.jks" >> "$GITHUB_ENV"
      - name: Signer et numéroter la version
        run: node scripts/signRelease.js android/app/build.gradle
      - name: Compilation du .aab signé
        working-directory: kalam/android
        run: ./gradlew bundleRelease --no-daemon
      - name: Vérifier la signature avant l'envoi (clé de publication, jamais celle de débogage)
        run: |
          aab=android/app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify -verbose -certs "$aab" | tee "$RUNNER_TEMP/js.txt" | tail -3
          grep -q "jar verified" "$RUNNER_TEMP/js.txt"
          if grep -q "Android Debug" "$RUNNER_TEMP/js.txt"; then echo "::error::Le .aab est signé avec la clé de débogage: envoi annulé"; exit 1; fi
      - name: Envoyer sur Google Play
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ secrets.KALAM_APP_ID }}
          releaseFiles: kalam/android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track }}
          status: ${{ inputs.status }}
      - name: Effacer la clé
        if: always()
        run: rm -f "$RUNNER_TEMP/kalam-upload.jks"
