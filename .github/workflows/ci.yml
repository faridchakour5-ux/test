name: CI

on:
  push:
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kalam
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kalam/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --ci
      # Les jours, séries et objectifs dépendent du fuseau horaire: toute la suite est rejouée dans deux fuseaux extrêmes
      # (Kiritimati, UTC+14, et Los Angeles, avec heure d'été), en plus du fuseau par défaut du serveur (UTC).
      - name: Tests dans le fuseau Pacific/Kiritimati
        run: npm test -- --ci
        env:
          TZ: Pacific/Kiritimati
      - name: Tests dans le fuseau America/Los_Angeles
        run: npm test -- --ci
        env:
          TZ: America/Los_Angeles
      # Compilation réelle du bundle Android (Hermes), comme le fera EAS: détecte tout de suite un import natif cassé.
      - name: Bundle Android
        run: npx expo export --platform android --output-dir /tmp/kalam-android
      # Manifeste Android réel (ce que verra Google Play): seules les permissions voulues, les autres explicitement retirées.
      - name: Manifeste Android (permissions)
        run: |
          rm -rf /tmp/kalam-native && mkdir -p /tmp/kalam-native/app
          tar --exclude=./node_modules --exclude=./android --exclude=./ios -cf - . | tar -xf - -C /tmp/kalam-native/app
          ln -s "$PWD/node_modules" /tmp/kalam-native/app/node_modules
          cd /tmp/kalam-native/app && npx expo prebuild --platform android --no-install
          node -e "
          const m=require('fs').readFileSync('android/app/src/main/AndroidManifest.xml','utf8');
          const kept=[...m.matchAll(/<uses-permission android:name=\"([^\"]+)\"\/>/g)].map(x=>x[1]).sort();
          const want=['android.permission.INTERNET','android.permission.RECORD_AUDIO'];
          if (JSON.stringify(kept)!==JSON.stringify(want)) { console.error('permissions inattendues', kept); process.exit(1); }
          if (!/allowBackup=\"false\"/.test(m)) { console.error('allowBackup doit être false'); process.exit(1); }
          console.log('ok', kept.join(' '))"
      # Même compilation avec un identifiant d'application personnalisé et un build « production » correctement configuré.
      - name: Configuration de production (identifiant et serveur)
        run: >-
          npx expo config --type public --json |
          node -e "const d=JSON.parse(require('fs').readFileSync(0,'utf8')); if (d.android.package!=='com.exemple.kalam') { console.error('identifiant inattendu', d.android.package); process.exit(1); } console.log('ok', d.android.package)"
        env:
          KALAM_APP_ID: com.exemple.kalam
          EAS_BUILD_PROFILE: production
          EXPO_PUBLIC_API_URL: https://api.exemple.test

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test

  # Compilation native réelle du fichier .aab (Gradle, comme le fera EAS), sans clé de publication: détecte tout de suite
  # un module natif incompatible. Le fichier produit n'est pas conservé et ne sert à rien d'autre qu'à ce contrôle.
  android-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: kalam
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kalam/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - name: Projet Android natif
        run: npx expo prebuild --platform android --no-install
      # Même chemin que le workflow d'envoi, avec une clé JETABLE créée ici: vérifie que la signature de publication fonctionne.
      - name: Clé jetable et signature de publication
        run: |
          keytool -genkeypair -storetype PKCS12 -keystore "$RUNNER_TEMP/test.jks" -alias test -keyalg RSA -keysize 2048 -validity 2 \
            -storepass testpass1 -keypass testpass1 -dname "CN=CI test"
          node scripts/signRelease.js android/app/build.gradle
        env:
          KALAM_KEYSTORE_FILE: ${{ runner.temp }}/test.jks
          KALAM_KEYSTORE_PASSWORD: testpass1
          KALAM_KEY_ALIAS: test
          KALAM_KEY_PASSWORD: testpass1
          KALAM_VERSION_CODE: 7
      - name: Compilation du .aab
        working-directory: kalam/android
        run: ./gradlew bundleRelease --no-daemon --stacktrace
        env:
          KALAM_KEYSTORE_FILE: ${{ runner.temp }}/test.jks
          KALAM_KEYSTORE_PASSWORD: testpass1
          KALAM_KEY_ALIAS: test
          KALAM_KEY_PASSWORD: testpass1
      # Manifeste FINAL (fusionné avec celui des bibliothèques): ce que Google Play verra vraiment. On affiche la liste complète
      # des permissions et on refuse toute permission sensible.
      - name: Manifeste fusionné (permissions réelles)
        run: |
          m=$(find android/app/build -path '*merged_manifests/release*' -name AndroidManifest.xml | head -1)
          test -n "$m" || { echo "::error::manifeste fusionné introuvable"; exit 1; }
          echo "Manifeste: $m"
          grep -o 'uses-permission[^>]*android:name="[^"]*"' "$m" | grep -o 'android:name="[^"]*"' | sort -u | tee /tmp/perms.txt
          # Liste blanche stricte: toute autre permission (même ajoutée par une bibliothèque) fait échouer la CI.
          allowed='^android:name="(android\.permission\.(ACCESS_NETWORK_STATE|INTERNET|POST_NOTIFICATIONS|RECEIVE_BOOT_COMPLETED|RECORD_AUDIO|WAKE_LOCK)|[A-Za-z0-9_.]+\.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION)"$'
          unexpected=$(grep -Ev "$allowed" /tmp/perms.txt || true)
          if [ -n "$unexpected" ]; then echo "::error::permissions inattendues dans le manifeste final:"; echo "$unexpected"; exit 1; fi
          grep -q 'permission.RECORD_AUDIO"' /tmp/perms.txt
          grep -q 'permission.INTERNET"' /tmp/perms.txt
      - name: Le .aab est signé par la clé de publication (pas par celle de débogage)
        run: |
          ls -l android/app/build/outputs/bundle/release/*.aab
          jarsigner -verify -verbose -certs android/app/build/outputs/bundle/release/app-release.aab | tee /tmp/js.txt | tail -3
          grep -q "CN=CI test" /tmp/js.txt
          ! grep -q "Android Debug" /tmp/js.txt
